<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      max-width: 680px; 
      margin: 0 auto; 
      padding: 24px; 
      color: #1a1a1a;
      line-height: 1.6;
    }
    
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 28px 24px;
      border-radius: 8px 8px 0 0;
      color: white;
    }
    
    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    
    .header .subtitle {
      color: #a8b8d8;
      margin: 8px 0 0;
      font-size: 13px;
      font-weight: 500;
    }
    
    .content {
      background: #fafbfc;
      padding: 28px;
      border: 1px solid #e5e7eb;
      border-top: none;
      border-radius: 0 0 8px 8px;
    }
    
    h2 {
      color: #0f3a7d;
      margin: 32px 0 16px 0;
      font-size: 20px;
      font-weight: 700;
      padding-bottom: 12px;
      border-bottom: 2px solid #e5e7eb;
    }
    
    h2:first-child {
      margin-top: 0;
    }
    
    .signal-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    p {
      margin: 12px 0;
      color: #374151;
    }
    
    strong {
      color: #0f3a7d;
      font-weight: 700;
    }
    
    .what-label, .why-label, .so-what-label {
      display: inline-block;
      background: #dbeafe;
      color: #0c4a6e;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
      margin-right: 6px;
    }
    
    .why-label {
      background: #fef3c7;
      color: #92400e;
    }
    
    .so-what-label {
      background: #dbeafe;
      color: #0c4a6e;
    }
    
    .architects-lens {
      background: #f0f9ff;
      border-left: 4px solid #0284c7;
      padding: 20px;
      margin: 28px 0;
      border-radius: 4px;
    }
    
    .architects-lens h3 {
      color: #0c4a6e;
      margin: 0 0 12px 0;
      font-size: 16px;
      font-weight: 700;
    }
    
    .architects-lens p {
      margin: 0;
      color: #0c4a6e;
    }
    
    hr {
      border: none;
      border-top: 2px solid #e5e7eb;
      margin: 24px 0;
    }
    
    .footer {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }
    
    /* Make links blue and underlined */
    a {
      color: #0284c7;
      text-decoration: underline;
    }
    /* Sources block styling (per-signal) */
    .sources {
      margin-top: 12px;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #e6f0ff;
      border-left: 4px solid #c7e7ff;
      border-radius: 6px;
      font-size: 13px;
      color: #374151;
    }

    .sources ul {
      margin: 8px 0 0 18px;
      padding: 0;
    }

    .sources li {
      margin-bottom: 6px;
    }

    .source-link {
      color: #0369a1;
      text-decoration: underline;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🔍 Weekly Weak Signal Scan</h1>
    <div class="subtitle">
      {{ run_date }} · Software Architecture × Canadian Banking × AI &amp; Developer Teams
    </div>
  </div>

  <div class="content">
    {{ body_html }}
  </div>

  <div class="footer">
    Generated by Claude (Anthropic) with live web search · Delivered via GitHub Actions
  </div>

</body>
</html>
